[workspace]
resolver = "2"
members = [
    "crates/hermes-simd-macros",
    "crates/hermes-simd-core",
    "crates/hermes-simd-intrinsics",
    "crates/hermes-simd",
    "crates/hermes-simd-benches",
    "crates/hermes-simd-examples",
    "crates/hermes-simd-types",
]

[workspace.package]
version = "0.5.0"
# Stays on edition 2021: edition 2024 makes `unsafe_op_in_unsafe_fn` warn-by-default,
# and `cargo fix --edition` discharges it across the ~750 SIMD intrinsic `unsafe fn`s
# by wrapping each body in a blanket `unsafe { .. }` — an unverifiable rubber-stamp that
# states no real per-operation invariant. Migrating correctly requires hand-authored
# SAFETY blocks per intrinsic (a dedicated, separately-verified effort); until then a
# partial migration is worse than staying on 2021. Revisit as a tracked [arch] item.
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "High-performance, zero-overhead SIMD abstraction library"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git", default-features = false }
themis = { git = "https://github.com/ryancinsight/themis", version = "0.10.0", default-features = false }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }

# Integer overflow must trap during development and tests (numerical-discipline
# mandate): a silent wraparound can defeat a length/bounds check that gates an
# unsafe SIMD load. The `test` profile inherits `dev`. Release keeps the default
# (`overflow-checks = false`) for hot-loop performance; the tiling dimension
# checks use explicit `checked_*` arithmetic (see `tiling::dims`) so operand-span
# safety holds independently of this profile flag.
[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1


# ATLAS-PATH-DEP-AUDIT-2: redirect git+https sibling pulls to local working
# copies so the entire dep graph uses a single version of each Atlas
# foundation crate. Unused patches emit warnings only; cargo treats the
# block as defense-in-depth.
# Last delivery: 2026-07-27 closure cycle.

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure

# ATLAS-PATH-DEP-AUDIT-2 round-6b closure

[patch."https://github.com/ryancinsight/Mnemosyne.git"]
mnemosyne = { path = "../mnemosyne/crates/mnemosyne" }
mnemosyne-arena = { path = "../mnemosyne/crates/mnemosyne-arena" }
mnemosyne-backend = { path = "../mnemosyne/crates/mnemosyne-backend" }
mnemosyne-build-util = { path = "../mnemosyne/crates/mnemosyne-build-util" }
mnemosyne-core = { path = "../mnemosyne/crates/mnemosyne-core" }
mnemosyne-decay = { path = "../mnemosyne/crates/mnemosyne-decay" }
mnemosyne-hardened = { path = "../mnemosyne/crates/mnemosyne-hardened" }
mnemosyne-local = { path = "../mnemosyne/crates/mnemosyne-local" }
mnemosyne-prof = { path = "../mnemosyne/crates/mnemosyne-prof" }

[patch."https://github.com/ryancinsight/themis"]
themis = { path = "../themis" }

