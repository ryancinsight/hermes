[workspace]
resolver = "2"
members = [
    "crates/hermes-simd-macros",
    "crates/hermes-simd-core",
    "crates/hermes-simd-intrinsics",
    "crates/hermes-simd",
    "crates/hermes-simd-benches",
    "crates/hermes-simd-examples",
    "crates/hermes-simd-types",
]

[workspace.package]
version = "0.7.0"
# Stays on edition 2021: edition 2024 makes `unsafe_op_in_unsafe_fn` warn-by-default,
# and `cargo fix --edition` discharges it across the ~750 SIMD intrinsic `unsafe fn`s
# by wrapping each body in a blanket `unsafe { .. }` — an unverifiable rubber-stamp that
# states no real per-operation invariant. Migrating correctly requires hand-authored
# SAFETY blocks per intrinsic (a dedicated, separately-verified effort); until then a
# partial migration is worse than staying on 2021. Revisit as a tracked [arch] item.
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "High-performance, zero-overhead SIMD abstraction library"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ryancinsight/hermes"
# Shared registry classification. `readme` is deliberately NOT inherited: an
# inherited `readme` path resolves against the workspace root, which would point
# every member at the root README instead of its own landing page.
categories = ["hardware-support", "algorithms", "no-std"]

# Single source of truth for the lint floor. Members inherit with
# `[lints] workspace = true`; a member re-declaring a level forks this table.
# Per-site suppressions use `#[expect(lint, reason = "...")]`, never a
# crate-level `#![allow]` — a blanket allow silences the lint for code written
# years later, which is how `missing_safety_doc` came to be off across the
# whole intrinsics crate.
[workspace.lints.rust]
# `missing_docs` is deliberately absent: like the clippy denials below it is a
# library-only rule, and a package-scoped table would also impose it on every
# test, bench, and example crate root. It is denied at each library crate root.
#
# Declared workspace-wide because `[lints] workspace = true` cannot coexist with
# a member-local `[lints.rust]` table; the benchmark cfg is only *set* by
# hermes-simd-intrinsics, and declaring it known elsewhere costs nothing.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(hermes_benchmark_generic_default)",
] }

[workspace.lints.clippy]
# `priority = -1` lets the individual entries below override the group.
#
# Denied, not warned: the committed gate runs `-D warnings`, so a pedantic hit
# already fails CI, but at `warn` a bare local `cargo clippy` reports it as
# advisory. `deny` makes the floor identical in both. A full
# `cargo clippy --workspace --all-targets` census (with and without
# `--all-features`) measured 0 hits outside the curated allows below, so every
# class not listed here is a hard error.
pedantic = { level = "deny", priority = -1 }

# Safety and hygiene floor.
#
# `dbg!` is never legitimate in committed code, in any target, so it is denied
# here. `unwrap_used`, `print_stdout`, and `print_stderr` are NOT: they must
# apply to library code but not to tests, benchmarks, examples, or the two
# `publish = false` tooling packages, and a Cargo `[lints]` table is
# package-scoped with no way to express that. They are therefore denied at each
# library crate root, where `#![cfg_attr(test, allow(..))]` can carve out the
# in-crate test modules. Putting them here instead would fail 29 test, bench,
# and example targets whose `unwrap()` calls are entirely legitimate.
dbg_macro = "deny"
# Mechanizes the `#[allow]` -> `#[expect]` migration: `expect` self-expires when
# the underlying finding is fixed, so stale suppressions cannot accumulate.
# Denied for the same reason as the pedantic group: `-D warnings` already makes
# it fatal in CI, and `deny` makes a bare local run agree.
allow_attributes = "deny"

# Curated allows. Each entry is a pedantic lint whose signal is negative *for
# this domain*; the set is reviewed like code, not grown on convenience. Every
# class NOT listed is a hard error.
#
# Counts are `cargo clippy --workspace --all-targets --all-features` hits when
# the floor was promoted to `deny`, measured by re-enabling each allow on the
# command line; production excludes `#[cfg(test)]` modules and the test, bench
# and example crates. Burn a class down to zero, then delete its line -- the
# floor tightens, never loosens.
#
# Classes with few enough sites to fix outright were fixed, not listed:
# manual_div_ceil (1 site, an overflowing `(n + C - 1) / C` replaced by
# `div_ceil`), new_without_default (1 site, the hand-rolled `OnceLock`), and
# missing_const_for_thread_local is satisfied by the `const {}` initialisers;
# Windows Clippy 1.97 still reports a false positive, so the three affected
# sites carry Windows-only expectations. let_unit_value, unit_arg and
# manual_memcpy were measured at zero sites and dropped as dead allows.
#
# A SIMD kernel library is built from lane-index and mask arithmetic that
# crosses width boundaries by construction (usize lane counts into i32 gather
# indices, element counts into byte offsets). These four fire on essentially
# every such expression, and the real defenses are the `checked_*` dimension
# arithmetic and `overflow-checks` in dev/test, not a cast-site lint.
cast_possible_wrap = "allow"           # 228 (178 prod)
cast_precision_loss = "allow"          # 233 (6 prod)
cast_possible_truncation = "allow"     # 124 (50 prod)
cast_sign_loss = "allow"               # 104 (87 prod)
# `#[inline(always)]` is load-bearing here, not a habit: the whole zero-cost
# claim rests on kernel bodies inlining into their dispatch sites.
inline_always = "allow"                # 606 (606 prod)
# Vector code names operands in conventional pairs (`a`/`b`, `lo`/`hi`,
# `re`/`im`) and math kernels index with `i`/`j`/`k`/`m`/`n`. Renaming these to
# satisfy a lint would make the kernels harder to check against their formulae.
similar_names = "allow"                # 63 (50 prod)
many_single_char_names = "allow"       # 29 (18 prod)
# `hermes_simd_core::simd::SimdView` and friends: the repetition is the domain
# vocabulary and removing it would degrade the public API names.
module_name_repetitions = "allow"      # 89 (88 prod)

# Consolidated from the three per-crate `#![allow(..)]` blocks that previously
# stated overlapping policy in hermes-simd, -core, and -intrinsics. Kept because
# each conflicts with how vector kernels are written, not because it was
# inconvenient to fix.
#
# Lane loops index several parallel buffers at once (`buf_a[i]`, `buf_b[i]`,
# `out[i]`), which is precisely the shape `needless_range_loop` rewrites into
# an unreadable zip chain.
needless_range_loop = "allow"          # 61 (58 prod)
# `a[i] = a[i] + b[i]` mirrors the fused-multiply-add formulae the kernels
# implement; collapsing to `+=` obscures the correspondence.
assign_op_pattern = "allow"            # 7 (7 prod)
# Kernel entry points genuinely take many operands (pointers, strides, lane
# counts, masks); bundling them into structs would add an indirection the
# zero-cost contract does not permit.
too_many_arguments = "allow"           # 9 (9 prod)
# Written in the form the surrounding lane arithmetic uses.
manual_is_multiple_of = "allow"        # 24 (24 prod)

[workspace.dependencies]
# Temporary co-evolution pin for Mnemosyne PR #123; remove `rev` after the
# memory provider source-identity correction merges to main and regenerate
# Cargo.lock.
mnemosyne = { package = "mnemosyne-memory", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "249a409106644e8343a693a31adbb614df885e15", version = "0.7.0", default-features = false }
themis = { package = "themis-topology", git = "https://github.com/ryancinsight/themis", version = "0.10.1", default-features = false }
# Temporary co-evolution pin for Eunomia PR #87; remove `rev` after the
# provider derive delivery merges to main and regenerate Cargo.lock.
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", rev = "fdbf12275d35aa1545060a4277644c497ddcda37", default-features = false }
tracing = { version = "0.1", default-features = false }

# Integer overflow must trap during development and tests (numerical-discipline
# mandate): a silent wraparound can defeat a length/bounds check that gates an
# unsafe SIMD load. The `test` profile inherits `dev`. Release keeps the default
# (`overflow-checks = false`) for hot-loop performance; the tiling dimension
# checks use explicit `checked_*` arithmetic (see `tiling::dims`) so operand-span
# safety holds independently of this profile flag.
[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
