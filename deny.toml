# cargo-deny configuration — supply-chain gates run in CI.

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only; anything else fails the supply-chain job and
# requires an explicit, reviewed exception here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
