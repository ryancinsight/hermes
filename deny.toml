# cargo-deny configuration — supply-chain gates run in CI.

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only; anything else fails the supply-chain job and
# requires an explicit, reviewed exception here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Same rationale as `unlicensed` above: mnemosyne's sub-crates don't set
# `publish = false` (or a version-pinned path dep), which cargo-deny flags
# as an unpublishable wildcard on a nominally-public crate. hermes's own
# crates are fixed directly (publish = false, below); the sibling repos'
# publish intent isn't hermes's call to make.
wildcards = "warn"
# Workspace members reference each other by path without versions; these are
# not registry wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Atlas providers resolve from their reviewed default branches; Cargo.lock pins
# the exact commit consumed by every reproducible build.
allow-git = [
    "https://github.com/ryancinsight/eunomia",
    "https://github.com/ryancinsight/melinoe.git",
    "https://github.com/ryancinsight/Mnemosyne.git",
    "https://github.com/ryancinsight/themis",
]
