name: Crates.io Release

# Releases publish from three triggers. A merged manifest version bump (push to
# main) and a daily schedule run `publish-pending`, which publishes every
# crate whose version the registry lacks (ADR 0068). A published release and a
# manual dispatch keep the single-crate route through `crates-publish.yml`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  # A public-surface break the manifest version does not cover
  # stops the release here. The baseline is the latest published
  # version, so the list is the crates the registry carries.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate (release)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@50802ef4c975bdb1e668b94a700d8310f0348e9c
    with:
      release-gate: true
      package: hermes-simd,hermes-simd-core,hermes-simd-intrinsics,hermes-simd-macros,hermes-simd-types
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Version-change publishing (ADR 0068). This job alone holds
  # `contents: write` (it creates the release tags).
  publish-pending:
    name: Publish pending versions
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@50802ef4c975bdb1e668b94a700d8310f0348e9c
    permissions:
      contents: write # release tags for the published versions
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
