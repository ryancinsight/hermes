name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: fmt + clippy + test + doc (x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      # nextest applies the committed .config/nextest.toml timeout instrument
      # (30s slow / 60s terminate) — bare `cargo test` bypasses it. Doctests are
      # not executed by nextest, so they run as a separate step.
      # Declares the backends this runner must actually execute. AVX-512 is
      # deliberately absent: GitHub's x86 runners vary between parts that have
      # it and parts that do not, so requiring it here would fail at random.
      # That non-determinism is why the SDE job exists.
      - name: Tests (nextest, dev profile; release uses panic=abort which conflicts with the test harness)
        run: cargo nextest run --workspace
        env:
          HERMES_EXPECTED_TARGETS: scalar,avx2
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Examples build (rot gate)
        run: cargo build --examples --workspace
      - name: Docs (warning-clean)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: no_std check (compile-time dispatch + scalar fallback only)
        run: cargo check --workspace --no-default-features

  benchmark-budgets:
    name: benchmark runtime budgets
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Twelve smoke targets at 60 seconds plus two canonical full targets at
    # 300 seconds yield a 22-minute analytical ceiling. Compilation and runner
    # overhead retain eight minutes of margin without admitting an unbounded job.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Compile benchmark binaries outside runtime budgets
        run: cargo bench --locked --workspace --no-run
      - name: Smoke-run every benchmark binary within 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] as $package | $package.targets[] | select(.kind | index("bench")) | [$package.name, .name] | @tsv' \
            | while IFS=$'\t' read -r package benchmark; do
            timeout --foreground --kill-after=10s 60s \
              cargo bench --locked -p "$package" --bench "$benchmark" -- --test
          done
      - name: Run changed canonical benchmarks within 300 seconds
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench dense
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd-benches --bench simd_bench

  miri:
    name: miri (core + intrinsics boundary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Miri nextest (core pointer logic)
        run: cargo +nightly miri nextest run -p hermes-simd-core --all-features --locked
      - name: Miri nextest (intrinsics boundary state)
        run: cargo +nightly miri nextest run -p hermes-simd-intrinsics --all-features --locked

  test-avx512-sde:
    name: test (AVX-512 / AMX under Intel SDE)
    runs-on: ubuntu-latest
    # Emulation costs one to two orders of magnitude over native. The suite
    # runs natively in well under a minute, so 45 minutes carries a large
    # margin while still refusing an unbounded job.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Setup Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: Record host versus emulated capability
        shell: bash
        run: |
          echo "Host AVX-512 flags (empty means the runner silicon has none):"
          grep -om1 'avx512[a-z0-9_]*' /proc/cpuinfo | sort -u || true
          echo "Host AMX flags:"
          grep -om1 'amx[a-z0-9_]*' /proc/cpuinfo | sort -u || true
          echo "SDE emulates Sapphire Rapids below, so the AVX-512 and AMX"
          echo "branches execute regardless of what the runner reports here."
      # `-spr` emulates Sapphire Rapids: AVX-512F/BW/VL/BF16/VNNI plus AMX.
      # The cargo target runner applies the emulator to the *test binaries*
      # only, so compilation stays native and only execution pays the cost.
      # An explicit --target is required for cargo to honor the runner.
      - name: Tests under emulated Sapphire Rapids
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "${{ env.SDE_PATH }}/sde64 -spr --"
          HERMES_EXPECTED_TARGETS: scalar,avx2,avx512
        run: |
          cargo nextest run --workspace --profile sde \
            --target x86_64-unknown-linux-gnu

  test-aarch64:
    name: test (aarch64, runtime NEON validation)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - uses: taiki-e/install-action@nextest
      - name: Tests (nextest, committed timeout config)
        run: cargo nextest run --workspace
        env:
          HERMES_EXPECTED_TARGETS: scalar,neon
      - name: Doctests
        run: cargo test --doc --workspace

  cross-check:
    name: cross-compile check (aarch64 target from x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-gnu
      - name: Ensure cross target is installed
        run: rustup target add --toolchain 1.97.0 aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu

  supply-chain:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      # The cargo-deny container image ships its own toolchain and trips over
      # rust-toolchain.toml; install the pinned toolchain + cargo-deny instead.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
