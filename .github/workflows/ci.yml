name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Runs first and alone: it needs no toolchain, no cache and no build, and it
  # guards the one artifact whose correctness cannot be checked from inside the
  # environment that produces it. Working on this repository inside the Atlas
  # stack puts a `[patch]` overlay on the path, under which cargo resolves every
  # first-party dependency to a local directory and writes a lock with all its
  # `source = "git+..."` lines stripped. That lock resolves fine locally and
  # fails every `--locked` job here, so the failure is invisible until CI.
  # Calls the shared Atlas workflow rather than copying the job, matching the
  # stack's existing shared-pipeline form (ADR 0035).
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@49cba25c1dca207c6adbe86670ebc25c1ee9e632
    permissions:
      contents: read
    with:
      strict: true

  gates:
    name: fmt + clippy + test + doc (x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Compile the benchmark-only generic-default configuration on every x86
      # runner. Runtime capability still gates the native AVX-512 comparison,
      # but cfg/import correctness must not depend on runner-class lottery.
      - name: Compile generic-default SIMD configuration
        env:
          RUSTFLAGS: >-
            -D warnings
            --check-cfg=cfg(hermes_benchmark_generic_default)
            --cfg hermes_benchmark_generic_default
        run: cargo check --locked -p hermes-simd --bench permute
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      # nextest applies the committed .config/nextest.toml timeout instrument
      # (30s slow / 60s terminate) — bare `cargo test` bypasses it. Doctests are
      # not executed by nextest, so they run as a separate step.
      # Declares the backends this runner must actually execute. AVX-512 is
      # deliberately absent: GitHub's x86 runners vary between parts that have
      # it and parts that do not, so requiring it here would fail at random.
      # That non-determinism is why the SDE job supplies the deterministic
      # semantic gate and the test-avx512-hosted job asserts AVX-512 only when
      # the hosted silicon happens to have it.
      # --no-capture is required: nextest swallows stdout for passing tests,
      # so without it the matrix would print only when the assertion fails —
      # exactly the silence this step exists to remove.
      - name: Identify host backend coverage
        run: cargo nextest run -p hermes-simd -E 'test(host_backend_coverage)' --no-capture
        env:
          HERMES_EXPECTED_TARGETS: scalar,avx2,sve
      - name: Tests (nextest, dev profile; release uses panic=abort which conflicts with the test harness)
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Examples build (rot gate)
        run: cargo build --examples --workspace
      - name: Docs (warning-clean)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: no_std check (compile-time dispatch + scalar fallback only)
        run: cargo check --workspace --no-default-features

  benchmark-budgets:
    name: benchmark runtime budgets
    runs-on: ubuntu-latest
    # Twelve smoke targets at 60 seconds plus two canonical full targets at
    # 300 seconds yield a 22-minute analytical ceiling. Compilation and runner
    # overhead retain eight minutes of margin without admitting an unbounded job.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - name: Compile benchmark binaries outside runtime budgets
        run: cargo bench --locked --workspace --no-run
      - name: Smoke-run every benchmark binary within 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] as $package | $package.targets[] | select(.kind | index("bench")) | [$package.name, .name] | @tsv' \
            | while IFS=$'\t' read -r package benchmark; do
            timeout --foreground --kill-after=10s 60s \
              cargo bench --locked -p "$package" --bench "$benchmark" -- --test
          done
      - name: Run changed canonical benchmarks within 300 seconds (pull requests and manual runs)
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench dense
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd-benches --bench simd_bench

  miri:
    name: miri (core + intrinsics boundary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - name: Miri nextest (core pointer logic)
        run: cargo +nightly miri nextest run -p hermes-simd-core --all-features --locked
      - name: Miri nextest (intrinsics boundary state)
        run: cargo +nightly miri nextest run -p hermes-simd-intrinsics --all-features --locked

  test-avx512-sde:
    name: test (AVX-512 / AMX under Intel SDE)
    runs-on: ubuntu-latest
    # Emulation costs one to two orders of magnitude over native. The suite
    # runs natively in well under a minute, so 45 minutes carries a large
    # margin while still refusing an unbounded job.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - name: Setup Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: Record host versus emulated capability
        shell: bash
        run: |
          echo "Host AVX-512 flags (empty means the runner silicon has none):"
          grep -om1 'avx512[a-z0-9_]*' /proc/cpuinfo | sort -u || true
          echo "Host AMX flags:"
          grep -om1 'amx[a-z0-9_]*' /proc/cpuinfo | sort -u || true
          echo "SDE emulates Sapphire Rapids below, so the AVX-512 branch"
          echo "executes regardless of what the runner reports here."
          echo
          echo "AMX does NOT execute here, and this is not a gap in SDE."
          echo "SDE emulates the tile instructions, CPUID, and XGETBV, so"
          echo "conditions 1 and 2 of the probe would pass. Condition 3 is"
          echo "arch_prctl(ARCH_REQ_XCOMP_PERM, XFEATURE_XTILEDATA), a real"
          echo "syscall that SDE passes through to the host kernel -- which"
          echo "returns EOPNOTSUPP because the runner silicon has no AMX and"
          echo "the kernel therefore never admits XTILEDATA to its permitted"
          echo "set. A correct probe refuses, so 'amx' is deliberately absent"
          echo "from HERMES_EXPECTED_TARGETS below; adding it would assert a"
          echo "target that cannot run. Un-quarantining AMX for real needs"
          echo "Sapphire-Rapids-or-later silicon (backlog HS-429)."
      # `-spr` emulates Sapphire Rapids: AVX-512F/BW/VL/BF16/VNNI plus AMX.
      # The cargo target runner applies the emulator to the *test binaries*
      # only, so compilation stays native and only execution pays the cost.
      # An explicit --target is required for cargo to honor the runner.
      # Identification runs under the emulator too; against the bare host it
      # would report no AVX-512 and fail its own expectation. Passing here is
      # the assertion that SDE genuinely satisfies the runtime probes rather
      # than merely failing to break anything.
      - name: Identify emulated backend coverage
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "${{ env.SDE_PATH }}/sde64 -spr --"
          HERMES_EXPECTED_TARGETS: scalar,avx2,avx512,sve
        run: |
          cargo nextest run -p hermes-simd -E 'test(host_backend_coverage)' \
            --profile sde --target x86_64-unknown-linux-gnu --no-capture
      - name: Tests under emulated Sapphire Rapids
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "${{ env.SDE_PATH }}/sde64 -spr --"
        run: |
          cargo nextest run --workspace --profile sde \
            --target x86_64-unknown-linux-gnu

  test-avx512-hosted:
    name: test (AVX-512 best-effort on GitHub-hosted x86)
    runs-on: ubuntu-latest
    # GitHub's hosted x86 pool is heterogeneous: some Intel parts carry AVX-512
    # and others (AMD, older Intel) do not, and the CPU family cannot be pinned.
    # This job therefore records the machine class, then asserts AVX-512
    # coverage and captures the native benchmark only when the host happens to
    # provide the silicon. Coverage never degrades silently: the identification
    # report prints AVX-512 as NOT COVERED on hosts that lack it, the benchmark
    # skip is loud, and the SDE job remains the deterministic semantic gate.
    # The value this job adds is real-silicon timing evidence, which SDE cannot
    # provide.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      # Machine-class record: which hosted silicon produced this job's data.
      # The model name tags any baseline saved below; the flags decide whether
      # the AVX-512 assertion and benchmark run at all. avx512f is the probe
      # that gates the override kernels (VPERMPS/VPERMPD/VPERMI2PS/VPERMI2PD).
      - name: Record machine class
        id: machine
        shell: bash
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | sed 's/^.*: //')
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "machine class: $model"
          echo "AVX-512 flags: $(grep -m1 '^flags' /proc/cpuinfo | grep -o 'avx512[a-z0-9_]*' | sort -u | tr '\n' ' ')"
          if grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f; then
            echo "avx512=true" >> "$GITHUB_OUTPUT"
          else
            echo "avx512=false" >> "$GITHUB_OUTPUT"
          fi
      # The expectation is computed, not guessed: avx512 joins the asserted set
      # only when this host has the silicon, so the assertion is exactly as
      # strong as the host allows while a host that silently lost a declared
      # capability still fails. On hosts without AVX-512 the report row prints
      # NOT COVERED, making the gap visible rather than silent.
      - name: Identify host backend coverage
        env:
          HERMES_EXPECTED_TARGETS: "scalar,avx2${{ steps.machine.outputs.avx512 == 'true' && ',avx512' || '' }}"
        run: cargo nextest run -p hermes-simd -E 'test(host_backend_coverage)' --no-capture
      - name: Skip note (no AVX-512 silicon on this host)
        if: steps.machine.outputs.avx512 != 'true'
        shell: bash
        run: |
          echo "This hosted runner has no AVX-512 silicon, so the native AVX-512"
          echo "benchmark is skipped. Coverage on this host is visible as NOT"
          echo "COVERED in the identification report above. The main x86 gate"
          echo "still compiles the generic-default cfg; deterministic semantic"
          echo "coverage stays under the SDE job."
      # HS-429 acceptance: a criterion baseline captured on real silicon when
      # the host provides it. The permute A/B also executes HS-430's still-open
      # AVX-512 measurement, the x86 analog of the aarch64 job's neon-native
      # compare. save-baseline overwrites any cached prior-run baseline, so the
      # compare step always measures against the current host's own run.
      - name: Benchmark native AVX-512 permutes
        if: steps.machine.outputs.avx512 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Machine class: ${{ steps.machine.outputs.model }}"
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench permute \
              -- --save-baseline avx512-native --noplot
      - name: Compare AVX-512 overrides with the generic default
        if: steps.machine.outputs.avx512 == 'true'
        shell: bash
        env:
          RUSTFLAGS: >-
            -D warnings
            --check-cfg=cfg(hermes_benchmark_generic_default)
            --cfg hermes_benchmark_generic_default
        run: |
          set -euo pipefail
          echo "Machine class: ${{ steps.machine.outputs.model }}"
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench permute \
              -- --baseline avx512-native --noplot

  test-aarch64:
    name: test (aarch64, runtime NEON validation)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - name: Identify host backend coverage
        run: cargo nextest run -p hermes-simd -E 'test(host_backend_coverage)' --no-capture
        env:
          HERMES_EXPECTED_TARGETS: scalar,neon,sve
      - name: Tests (nextest, committed timeout config)
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Benchmark native NEON permutes
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench permute \
              -- --save-baseline neon-native --noplot
      - name: Compare NEON overrides with the generic default
        shell: bash
        env:
          RUSTFLAGS: >-
            -D warnings
            --check-cfg=cfg(hermes_benchmark_generic_default)
            --cfg hermes_benchmark_generic_default
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=10s 300s \
            cargo bench --locked -p hermes-simd --bench permute \
              -- --baseline neon-native --noplot

  cross-check:
    name: cross-compile check (aarch64 target from x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-gnu
      - name: Ensure cross target is installed
        run: rustup target add --toolchain 1.97.0 aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: hermes
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu

  supply-chain:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: hermes
      # The cargo-deny container image ships its own toolchain and trips over
      # rust-toolchain.toml; install the pinned toolchain + cargo-deny instead.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
