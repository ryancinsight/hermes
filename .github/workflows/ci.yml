name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: fmt + clippy + test + doc (x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      # hermes's [patch] table (Cargo.toml) resolves themis/eunomia/mnemosyne
      # to local-path siblings for cross-repo dev; CI must recreate that same
      # sibling layout so those patches resolve. actions/checkout refuses
      # paths outside $GITHUB_WORKSPACE, so hermes checks out into a named
      # subdirectory alongside each sibling, all directly under
      # $GITHUB_WORKSPACE (the true common parent).
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/themis
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/eunomia
          path: eunomia
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      # nextest applies the committed .config/nextest.toml timeout instrument
      # (30s slow / 60s terminate) — bare `cargo test` bypasses it. Doctests are
      # not executed by nextest, so they run as a separate step.
      - name: Tests (nextest, dev profile; release uses panic=abort which conflicts with the test harness)
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Examples build (rot gate)
        run: cargo build --examples --workspace
      - name: Docs (warning-clean)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: no_std check (compile-time dispatch + scalar fallback only)
        run: cargo check --workspace --no-default-features

  miri:
    name: miri (core + intrinsics boundary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/themis
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/eunomia
          path: eunomia
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: cargo miri test (core pointer logic)
        run: cargo +nightly miri test -p hermes-simd-core
      - name: cargo miri test (intrinsics boundary state)
        run: cargo +nightly miri test -p hermes-simd-intrinsics

  test-aarch64:
    name: test (aarch64, runtime NEON validation)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/themis
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/eunomia
          path: eunomia
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - uses: taiki-e/install-action@nextest
      - name: Tests (nextest, committed timeout config)
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --doc --workspace

  cross-check:
    name: cross-compile check (aarch64 target from x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/themis
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/eunomia
          path: eunomia
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermes
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu

  supply-chain:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
        with:
          path: hermes
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/themis
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/eunomia
          path: eunomia
      - uses: actions/checkout@v4
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
      # The cargo-deny container image ships its own toolchain and trips over
      # rust-toolchain.toml; install the pinned toolchain + cargo-deny instead.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
