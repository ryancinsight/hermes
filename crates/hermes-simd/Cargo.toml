[package]
name = "hermes-simd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
hermes-simd-core = { path = "../hermes-simd-core", version = "0.3.0", default-features = false }
hermes-simd-intrinsics = { path = "../hermes-simd-intrinsics", version = "0.3.0", default-features = false }
eunomia = { workspace = true }
hermes-simd-macros = { path = "../hermes-simd-macros", version = "0.3.0" }
hermes-simd-types = { path = "../hermes-simd-types", version = "0.3.0", default-features = false }
half = { workspace = true }

[dev-dependencies]
rkyv = { version = "0.7" }
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dense"
harness = false

[[bench]]
name = "complex"
harness = false

[features]
default = ["std", "mnemosyne-memory"]
# Linux NUMA node placement via libnuma (links -lnuma); off by default.
libnuma = ["hermes-simd-core/libnuma"]
mnemosyne-memory = [
    "hermes-simd-core/mnemosyne-memory",
    "hermes-simd-intrinsics/mnemosyne-memory",
    "hermes-simd-types/mnemosyne-memory",
]
std = [
    "hermes-simd-core/std",
    "hermes-simd-intrinsics/std",
    "eunomia/std",
    "hermes-simd-types/std",
]
