[package]
name = "hermes-simd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
# Not currently publishable: transitively depends on eunomia/mnemosyne via
# git (crates.io disallows git dependencies). Revisit once those SSOT crates
# are registry-published.
publish = false

[dependencies]
eunomia = { workspace = true, features = ["rkyv"] }
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.7" }
mnemosyne = { workspace = true, optional = true }
themis = { workspace = true }

[dev-dependencies]
hermes-simd-intrinsics = { path = "../hermes-simd-intrinsics", version = "0.4.0" }

[features]
default = ["std", "mnemosyne-memory"]
std = ["eunomia/std", "themis/std"]
mnemosyne-memory = ["dep:mnemosyne"]
# Linux NUMA affinity and residency probes via libnuma (links -lnuma); off by default.
libnuma = []
