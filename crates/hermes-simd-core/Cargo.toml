[package]
name = "hermes-simd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
eunomia = { workspace = true, features = ["rkyv"] }
half = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.7" }
mnemosyne = { workspace = true, optional = true }
themis = { workspace = true }

[dev-dependencies]
hermes-simd-intrinsics = { path = "../hermes-simd-intrinsics", version = "0.3.0" }

[features]
default = ["std", "parallel", "mnemosyne-memory"]
std = ["eunomia/std", "themis/std"]
parallel = []
mnemosyne-memory = ["dep:mnemosyne"]
# Linux NUMA node placement via libnuma (links -lnuma); off by default.
libnuma = []
