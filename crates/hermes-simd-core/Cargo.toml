[package]
name = "hermes-simd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core SIMD abstractions for hermes-simd: the SimdKernel trait, typestate views, masks, tiling, sparse formats, and copy-on-write containers"
repository.workspace = true
categories.workspace = true
readme = "README.md"
keywords = ["simd", "vectorization", "no-std", "zero-cost", "kernel"]

[dependencies]
eunomia = { workspace = true, features = ["rkyv"] }
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.8" }
mnemosyne = { workspace = true, optional = true }
themis = { workspace = true }

[dev-dependencies]
hermes-simd-intrinsics = { path = "../hermes-simd-intrinsics" }

[features]
default = ["std", "mnemosyne-memory"]
std = ["eunomia/std", "themis/std"]
mnemosyne-memory = ["dep:mnemosyne"]
# Linux NUMA affinity and residency probes via libnuma (links -lnuma); off by default.
libnuma = []
