[package]
name = "hermes-simd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
hermes-numeric = { path = "../hermes-numeric", default-features = false, features = ["rkyv"] }
half = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.7" }

[dev-dependencies]
hermes-simd-intrinsics = { path = "../hermes-simd-intrinsics" }

[lib]
doctest = false

[features]
default = ["std"]
std = ["hermes-numeric/std"]
# Linux NUMA node placement via libnuma (links -lnuma); off by default.
libnuma = []


