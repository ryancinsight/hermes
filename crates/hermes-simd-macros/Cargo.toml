[package]
name = "hermes-simd-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Procedural macros for hermes-simd code generation"
repository.workspace = true
categories = ["development-tools::procedural-macro-helpers", "hardware-support"]
readme = "README.md"
keywords = ["simd", "macros", "dispatch", "codegen", "proc-macro"]

[lib]
proc-macro = true
doctest = false

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

